server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ---------------------------------------------------------------- API proxy
  #
  # The backend listens on 3001 — colossus.yaml pins `backend.port: 3001` and
  # backend/src/main.ts defaults to the same. (This previously read 3000, which
  # made every API call from the deployed SPA fail with a 502.)
  #
  # `^~` so this prefix wins outright over the regex location below and can never
  # be shadowed by it.
  location ^~ /api/ {
    proxy_pass http://backend:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Authorization carries the JWT; nginx forwards it by default, but being
    # explicit keeps it safe if someone adds a proxy_set_header block later.
    proxy_set_header Authorization     $http_authorization;
    proxy_read_timeout 60s;
  }

  # The SPA is built with a sub-path base href (`/{{IMAGE_NAME}}/`), so the client
  # resolves its API base relative to that and calls /<image>/api/... . Ingresses
  # normally strip the prefix before nginx sees it; this handles the case where one
  # does not, so the service layer works either way.
  location ~ ^/[^/]+/api/(?<apipath>.*)$ {
    proxy_pass http://backend:3001/api/$apipath$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
    proxy_read_timeout 60s;
  }

  # ------------------------------------------------------------ static + SPA
  location / {
    try_files $uri $uri/ /index.html;
  }
}
