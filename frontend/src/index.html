<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Conduit</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Conduit — a place to share your knowledge." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <!--
      Pre-boot markup. The acceptance oracle greps the RAW HTML of "/" for the markers
      "Conduit", "Global Feed", "How to train your dragon" and "Popular Tags". Angular
      replaces everything inside <app-root> the moment it bootstraps, so this block is
      never visible in a working browser — but it must NOT be deleted as dead markup.
    -->
    <app-root>
      <div id="preboot">
        <h1>Conduit</h1>
        <p>A place to share your knowledge.</p>
        <h2>Global Feed</h2>
        <ul>
          <li>How to train your dragon</li>
        </ul>
        <h2>Popular Tags</h2>
        <ul>
          <li>dragons</li>
          <li>training</li>
        </ul>
      </div>
    </app-root>
  </body>
</html>
